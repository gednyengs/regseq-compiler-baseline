    brief: .harness/spec-batches/regseqmodel-phase-1.md
    spec_authoring_notes:
      - All types live under ir/ module.
      - Existing declaration/mir_body.rs types remain as extraction serialization format.
      - New ir/ types are the processed output after domain enrichment.
      - Serde uses adjacently-tagged enums, Symbol serialized as string.
    generated_task_ids:
