      - crates/regseq-macros/src/register_bitfields.rs
    summary: >
      Move register access methods from ReadOnly/WriteOnly/ReadWrite to
      Mmio<T>. Add RegisterOf trait, access control traits, RegisterId type.
      Implement register_block! proc macro that replaces register_bitfields!
      + manual #[repr(C)] struct with unified scoped definition.
    spec_authoring_notes:
      - This is a breaking change to the authored surface.
      - ReadOnly/WriteOnly/ReadWrite become layout-only types.
      - register_block! generates scoped module (e.g., pl011::Regs, pl011::dr, etc.).
      - modify() is NOT an intrinsic -- it calls read() then write() internally.
    generated_task_ids:
      - regseq-facade-22
      - regseq-facade-23
      - regseq-macros-04

