version: 2
purpose: >
  Tracks harness task-spec authoring progress for the RegseqModel refactor.
  This file is used only when there are no executable harness tasks
  available in .harness/tasks.json.

workflow:
  - Check .harness/tasks.json first. If any task is pending or in_progress, do not use this file.
  - Use this file only to decide what harness task spec or task batch should be authored next.
  - Update item status here when a spec batch has been elaborated into real harness tasks.
  - Do not use this file to track implementation execution status.

status_definitions:
  not_ready: Dependencies are not yet elaborated into harness tasks.
  ready_to_elaborate: This is the next task-spec batch that should be turned into harness tasks.
  in_elaboration: A task-spec batch is currently being drafted or reviewed.
  tasked: The corresponding harness task specs have been created.
  blocked: The task-spec batch cannot yet be authored due to an external decision or missing input.

note: >
  This tracker replaces the old architecture tracker (archived at
  .harness/archive/task-spec-status.yaml.old-architecture). All phases
  below correspond to the execution plan at
  docs/discussions/models/regseq-model/execution-plan.md.

  Infrastructure tasks from the old architecture (cargo-regseq 01-05,
  regseq-config 01-02, regseq-diagnostics 01, regseq-driver 01-03) are
  already done in tasks.json and are not re-tracked here.

items:
  # ---- Phase 0 + 1 + 2: New model and IR types (regseq-model) ----

  - id: regseqmodel-phase-0
    phase: "0"
    title: Foundation types -- identity scheme, type system, operators
    status: tasked
    depends_on: []
    target_harness_groups:
      - regseq-model
    source_refs:
      - docs/discussions/models/regseq-model/execution-plan.md
      - docs/discussions/models/regseq-model/spec.md
      - docs/discussions/models/regseq-model/ir-reference.md
    summary: >
      Implement the leaf types that all new code depends on: SymbolInterner
      with Symbol/FileId, DeclId with 9 typed wrappers plus LocalId and
      BasicBlockId, SourceLocation and SourceOrigin, RegseqType with
      ScalarType and Mutability, BinOp (26 variants) and UnOp.
    spec_authoring_notes:
      - These types have zero dependencies on existing regseq-model modules.
      - Create new identity/ and ir/ submodules alongside existing modules.
      - Each type needs construction + serde round-trip unit tests.
    generated_task_ids:
      - regseq-model-20
      - regseq-model-21
      - regseq-model-22
      - regseq-model-23

  - id: regseqmodel-phase-1
    phase: "1"
    title: CFG-based IR types -- Place, Operand, Rvalue, Statement, Terminator, Body
    status: tasked
    depends_on:
      - regseqmodel-phase-0
    target_harness_groups:
      - regseq-model
    source_refs:
      - docs/discussions/models/regseq-model/execution-plan.md
      - docs/discussions/models/regseq-model/ir-reference.md
    summary: >
      Implement the CFG-based IR type hierarchy: Place with Projection,
      Operand with LiteralValue, Rvalue with BorrowKind/CastKind/AggregateKind,
      RegseqIntrinsic and IntrinsicMetadata, StatementKind and TerminatorKind,
      Body with BasicBlock/LocalDecl/OrderedRegion/BodySourceMap.
    brief: .harness/spec-batches/regseqmodel-phase-1.md
    spec_authoring_notes:
      - All types live under ir/ module.
      - Existing declaration/mir_body.rs types remain as extraction serialization format.
      - New ir/ types are the processed output after domain enrichment.
      - Serde uses adjacently-tagged enums, Symbol serialized as string.
    generated_task_ids:
      - regseq-model-24
      - regseq-model-25
      - regseq-model-26
      - regseq-model-27
      - regseq-model-28
      - regseq-model-29
      - regseq-model-30

  - id: regseqmodel-phase-2
    phase: "2"
    title: Unified RegseqModel structure -- Module tree, driver struct, type defs
    status: tasked
    depends_on:
      - regseqmodel-phase-0
      - regseqmodel-phase-1
    target_harness_groups:
      - regseq-model
    source_refs:
      - docs/discussions/models/regseq-model/execution-plan.md
      - docs/discussions/models/regseq-model/spec.md
    summary: >
      Implement the unified RegseqModel: FrameworkTypeKind and
      TypeDefClassification, type definitions with classification,
      RegisterDescriptor/RegisterBlock, Function with Param/ParamKind,
      resource/property/user-data fields with Shape, Module with
      Driver/Normal kind, and the RegseqModel root struct.
    brief: .harness/spec-batches/regseqmodel-phase-2.md
    spec_authoring_notes:
      - New model/ module alongside existing modules.
      - Progressive population: declaration fields populated first, binding slots start as None.
    generated_task_ids:
      - regseq-model-31
      - regseq-model-32
      - regseq-model-33
      - regseq-model-34
      - regseq-model-35
      - regseq-model-36
      - regseq-model-37
      - regseq-model-38
      - regseq-model-39
      - regseq-model-40

  # ---- Phase 3: Facade, macros, fixture (parallel with 0-2) ----

  - id: regseqmodel-phase-3a
    phase: "3"
    title: Facade attribute annotations and ErrorKind removal
    status: tasked
    depends_on: []
    target_harness_groups:
      - regseq-facade
    source_refs:
      - docs/discussions/models/regseq-model/execution-plan.md
      - docs/discussions/models/regseq-model/spec.md
      - docs/discussions/models/regseq-model/compiler-knowledge.md
    summary: >
      Add #[rseq::framework_type], #[rseq::abstraction], and named
      #[rseq::intrinsic] attributes to all facade types and intrinsic
      methods. Remove ErrorKind alias.
    spec_authoring_notes:
      - Attributes are inert tool attributes -- adding them does not change compilation.
      - Register access intrinsics go on Mmio<T> methods, NOT on ReadOnly/WriteOnly/ReadWrite.
      - Clock, ResetLine, PinCtrl carry their own #[rseq::intrinsic] methods.
    generated_task_ids:
      - regseq-facade-20
      - regseq-facade-21

  - id: regseqmodel-phase-3b
    phase: "3"
    title: Register access surface restructure and register_block! macro
    status: tasked
    depends_on: []
    target_harness_groups:
      - regseq-facade
      - regseq-macros
    source_refs:
      - docs/discussions/models/regseq-model/execution-plan.md
      - docs/discussions/models/regseq-model/spec.md
      - docs/discussions/models/regseq-model/compiler-knowledge.md
      - crates/regseq/src/registers.rs
      - crates/regseq/src/mmio.rs
      - crates/regseq-macros/src/register_bitfields.rs
    summary: >
      Move register access methods from ReadOnly/WriteOnly/ReadWrite to
      Mmio<T>. Add RegisterOf trait, access control traits, RegisterId type.
      Implement register_block! proc macro that replaces register_bitfields!
      + manual #[repr(C)] struct with unified scoped definition.
    spec_authoring_notes:
      - This is a breaking change to the authored surface.
      - ReadOnly/WriteOnly/ReadWrite become layout-only types.
      - register_block! generates scoped module (e.g., pl011::Regs, pl011::dr, etc.).
      - modify() is NOT an intrinsic -- it calls read() then write() internally.
    generated_task_ids:
      - regseq-facade-22
      - regseq-facade-23
      - regseq-macros-04

  - id: regseqmodel-phase-3c
    phase: "3"
    title: ordered! macro migration and compiler config
    status: tasked
    depends_on: []
    target_harness_groups:
      - regseq-facade
      - regseq-macros
      - regseq-driver
    source_refs:
      - docs/discussions/models/regseq-model/execution-plan.md
      - docs/discussions/models/regseq-model/spec.md
      - crates/regseq-macros/src/ordered.rs
      - crates/regseq-driver/src/callbacks.rs
    summary: >
      Migrate ordered! macro from memory_barrier() intrinsic expansion to
      ordered_region_begin()/ordered_region_end() marker calls. Add marker
      functions to facade internal module. Update callbacks.rs to set
      release-profile MIR semantics (overflow-checks=false,
      debug-assertions=false).
    spec_authoring_notes:
      - Must complete before Phase 5 OrderedRegion detection.
      - Marker functions are compiler markers, not real intrinsics.
    generated_task_ids:
      - regseq-facade-24
      - regseq-driver-25

  - id: regseqmodel-phase-3d
    phase: "3"
    title: PL011 fixture comprehensive update
    status: tasked
    depends_on:
      - regseqmodel-phase-3b
    target_harness_groups:
      - track-a-pl011
    source_refs:
      - docs/discussions/models/regseq-model/execution-plan.md
      - tests/fixtures/pl011-full-spec/src/driver.rs
      - tests/fixtures/pl011-full-spec/src/registers.rs
    summary: >
      Convert PL011 fixture to new register architecture: register_block!
      macro, Mmio<pl011::Regs>, all register access via Mmio methods,
      scoped module imports, pin_state attributes on marker types.
    brief: .harness/spec-batches/regseqmodel-phase-3d.md
    spec_authoring_notes:
      - Depends on register_block! macro and Mmio method restructure being done.
      - Every register access statement changes form.
      - Must compile against the updated facade and macros crates.
    generated_task_ids:
      - track-a-pl011-06
      - track-a-pl011-07

  # ---- Phase 4: Extraction pipeline ----

  - id: regseqmodel-phase-4
    phase: "4"
    title: Extraction pipeline updates -- attribute registries, new surfaces, tests
    status: tasked
    depends_on:
      - regseqmodel-phase-3a
      - regseqmodel-phase-3b
      - regseqmodel-phase-3c
      - regseqmodel-phase-3d
    target_harness_groups:
      - regseq-driver
      - track-a-validation
    source_refs:
      - docs/discussions/models/regseq-model/execution-plan.md
      - crates/regseq-driver/src/callbacks.rs
      - crates/regseq-driver/src/raw_artifact.rs
      - crates/regseq-driver/src/extract/mod.rs
    summary: >
      Validate cross-crate attribute visibility. Build intrinsic, framework
      type, and abstraction registries. Add pin-state and source-location
      extraction. Expand RawFrontendArtifact. Update unit test specimens
      and golden files.
    brief: .harness/spec-batches/regseqmodel-phase-4.md
    spec_authoring_notes:
      - Cross-crate attribute validation gates the rest of this phase.
      - 33+ unit test specimens need #[rseq::] attribute updates.
      - Golden files must be regenerated after extraction output changes.
    generated_task_ids:
      - regseq-driver-26
      - regseq-driver-27
      - regseq-driver-28
      - regseq-driver-29
      - regseq-driver-30
      - regseq-driver-31
      - regseq-driver-32
      - regseq-driver-33
      - regseq-driver-34

  # ---- Phase 5: IR construction ----

  - id: regseqmodel-phase-5
    phase: "5"
    title: MIR-to-Regseq-IR construction pass
    status: tasked
    depends_on:
      - regseqmodel-phase-1
      - regseqmodel-phase-2
      - regseqmodel-phase-4
    target_harness_groups:
      - regseq-model
    source_refs:
      - docs/discussions/models/regseq-model/execution-plan.md
      - docs/discussions/models/regseq-model/ir-reference.md
      - docs/discussions/models/regseq-model/compiler-knowledge.md
    brief: .harness/spec-batches/regseqmodel-phase-5.md
    summary: >
      Build the two-pass IR construction: declaration skeleton (Pass 1)
      and body construction (Pass 2) with 7 recognition rules. Incremental
      implementation validated against 9 PL011 test functions of increasing
      complexity.
    spec_authoring_notes:
      - Hardest phase. Recommend splitting into multiple tasks per recognition rule.
      - Start with straight-line code, then branches, then ?-pattern, then loops.
      - No intermediate AnnotatedMirBody -- construct directly from MirBody JSON + registries.
    generated_task_ids:
      - regseq-model-41
      - regseq-model-42
      - regseq-model-43
      - regseq-model-44
      - regseq-model-45
      - regseq-model-46
      - regseq-model-47
      - regseq-model-48
      - regseq-model-49
      - regseq-model-50
      - regseq-model-51
      - regseq-model-52
      - regseq-model-53
      - regseq-model-54

  # ---- Phase 6: Normalization + join ----

  - id: regseqmodel-phase-6
    phase: "6"
    title: RegseqModel normalization, platform join, and legality verification
    status: ready_to_elaborate
    depends_on:
      - regseqmodel-phase-5
    target_harness_groups:
      - regseq-model
    source_refs:
      - docs/discussions/models/regseq-model/execution-plan.md
      - docs/discussions/models/regseq-model/spec.md
    brief: .harness/spec-batches/regseqmodel-phase-6.md
    summary: >
      Wire IR construction into the pipeline. Implement normalize() to
      produce RegseqModel, populate_bindings() for in-place platform join,
      and phase legality verification. Prove with full PL011 pipeline.
    spec_authoring_notes:
      - Platform parser is largely reusable; join logic changes from separate artifact to in-place mutation.
    generated_task_ids: []

  # ---- Phase 7: Consumer migration ----

  - id: regseqmodel-phase-7
    phase: "7"
    title: Consumer migration to RegseqModel
    status: not_ready
    depends_on:
      - regseqmodel-phase-6
    target_harness_groups:
      - regseq-analysis
      - regseq-lowering
      - regseq-driver
    source_refs:
      - docs/discussions/models/regseq-model/execution-plan.md
    brief: .harness/spec-batches/regseqmodel-phase-7.md
    summary: >
      Migrate all consumers from old model types to RegseqModel: analysis,
      lowering planner, Linux backend, pipeline glue, E2E tests. Uses
      temporary adapter layer for incremental migration.
    spec_authoring_notes:
      - Migrate in order: analysis -> lowering planner -> Linux backend -> pipeline glue -> tests.
      - Old modules stay alive during migration.
    generated_task_ids: []

  # ---- Phase 8: Backend C emission ----

  - id: regseqmodel-phase-8
    phase: "8"
    title: Backend C emission from CFG-based IR
    status: not_ready
    depends_on:
      - regseqmodel-phase-7
    target_harness_groups:
      - regseq-linux-backend
      - regseq-lowering
    source_refs:
      - docs/discussions/models/regseq-model/execution-plan.md
      - docs/discussions/models/regseq-model/compiler-knowledge.md
    brief: .harness/spec-batches/regseqmodel-phase-8.md
    summary: >
      Implement goto-based C emitter from CFG-based IR. Implement
      dominator-based resource cleanup for lifecycle callback error paths.
      Remove deprecated mir_interpreter/ and semantic_lowering/ code.
    spec_authoring_notes:
      - Goto-based emission first, structured recovery later.
      - PL011 init() has acknowledged rollback limitations (Cases 2, 7).
    generated_task_ids: []

  # ---- Phase 9: Cleanup ----

  - id: regseqmodel-phase-9
    phase: "9"
    title: Old module cleanup and final golden files
    status: not_ready
    depends_on:
      - regseqmodel-phase-8
    target_harness_groups:
      - regseq-model
      - track-a-validation
    source_refs:
      - docs/discussions/models/regseq-model/execution-plan.md
    brief: .harness/spec-batches/regseqmodel-phase-9.md
    summary: >
      Remove old model modules (declaration/, binding/, joined/, semantic/,
      item/, compat.rs). Final golden file regeneration with new JSON
      format. Final test cleanup.
    spec_authoring_notes:
      - Only after all consumers are migrated and tests pass.
    generated_task_ids: []
