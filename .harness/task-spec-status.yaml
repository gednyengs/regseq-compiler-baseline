version: 1
purpose: >
  Tracks harness task-spec authoring progress for the ASPLOS implementation
  plan. This file is used only when there are no executable harness tasks
  available in .harness/tasks.json.

workflow:
  - Check .harness/tasks.json first. If any task is pending or in_progress, do not use this file.
  - Use this file only to decide what harness task spec or task batch should be authored next.
  - Update item status here when a spec batch has been elaborated into real harness tasks.
  - Do not use this file to track implementation execution status.

status_definitions:
  not_ready: Dependencies are not yet elaborated into harness tasks.
  ready_to_elaborate: This is the next task-spec batch that should be turned into harness tasks.
  in_elaboration: A task-spec batch is currently being drafted or reviewed.
  tasked: The corresponding harness task specs have been created.
  blocked: The task-spec batch cannot yet be authored due to an external decision or missing input.

