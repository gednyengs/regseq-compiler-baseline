version: 2
purpose: >
  Tracks harness task-spec authoring progress for the RegseqModel refactor.
  This file is used only when there are no executable harness tasks
  available in .harness/tasks.json.

workflow:
  - Check .harness/tasks.json first. If any task is pending or in_progress, do not use this file.
  - Use this file only to decide what harness task spec or task batch should be authored next.
  - Update item status here when a spec batch has been elaborated into real harness tasks.
  - Do not use this file to track implementation execution status.

status_definitions:
  not_ready: Dependencies are not yet elaborated into harness tasks.
  ready_to_elaborate: This is the next task-spec batch that should be turned into harness tasks.
  in_elaboration: A task-spec batch is currently being drafted or reviewed.
  tasked: The corresponding harness task specs have been created.
  blocked: The task-spec batch cannot yet be authored due to an external decision or missing input.

note: >
  This tracker replaces the old architecture tracker (archived at
  .harness/archive/task-spec-status.yaml.old-architecture). All phases
  below correspond to the execution plan at
  docs/discussions/models/regseq-model/execution-plan.md.

  Infrastructure tasks from the old architecture (cargo-regseq 01-05,
  regseq-config 01-02, regseq-diagnostics 01, regseq-driver 01-03) are
  already done in tasks.json and are not re-tracked here.

items:
  # ---- Phase 0 + 1 + 2: New model and IR types (regseq-model) ----

  - id: regseqmodel-phase-0
    phase: "0"
    title: Foundation types -- identity scheme, type system, operators
    status: tasked
    depends_on: []
    target_harness_groups:
      - regseq-model
    source_refs:
      - docs/discussions/models/regseq-model/execution-plan.md
      - docs/discussions/models/regseq-model/spec.md
      - docs/discussions/models/regseq-model/ir-reference.md
    summary: >
      Implement the leaf types that all new code depends on: SymbolInterner
      with Symbol/FileId, DeclId with 9 typed wrappers plus LocalId and
      BasicBlockId, SourceLocation and SourceOrigin, RegseqType with
      ScalarType and Mutability, BinOp (26 variants) and UnOp.
    spec_authoring_notes:
      - These types have zero dependencies on existing regseq-model modules.
      - Create new identity/ and ir/ submodules alongside existing modules.
      - Each type needs construction + serde round-trip unit tests.
    generated_task_ids:
