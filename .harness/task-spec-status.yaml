version: 1
purpose: >
  Tracks harness task-spec authoring progress for the ASPLOS implementation
  plan. This file is used only when there are no executable harness tasks
  available in .harness/tasks.json.

workflow:
  - Check .harness/tasks.json first. If any task is pending or in_progress, do not use this file.
  - Use this file only to decide what harness task spec or task batch should be authored next.
  - Update item status here when a spec batch has been elaborated into real harness tasks.
  - Do not use this file to track implementation execution status.

status_definitions:
  not_ready: Dependencies are not yet elaborated into harness tasks.
  ready_to_elaborate: This is the next task-spec batch that should be turned into harness tasks.
  in_elaboration: A task-spec batch is currently being drafted or reviewed.
  tasked: The corresponding harness task specs have been created.
  blocked: The task-spec batch cannot yet be authored due to an external decision or missing input.

items:
  - id: phase-a-01
    phase: A
    title: Workspace activation and crate-topology decisions
    brief: .harness/spec-batches/phase-a-01.md
    status: ready_to_elaborate
    depends_on: []
    target_harness_groups:
      - regseq-facade
      - regseq-macros
      - regseq-model
      - regseq-analysis
      - regseq-backends
      - regseq-diagnostics
    source_refs:
      - docs/plans/asplos-implementation-plan.md
      - docs/guide/implementation-guide.md
      - Cargo.toml
    summary: >
      Add missing implementation crates to the workspace, establish the crate
      topology from the implementation plan, and make the workspace ready for
      later API-first tasks.
    spec_authoring_notes:
      - Resolve workspace membership changes before any DSL or extractor task specs are written.
      - "Preserve the plan's topology decision: regseq-model owns rustc-independent models; regseq-driver owns extraction."
      - Keep Linux and Zephyr as separate task groups even if they share regseq-backends.
    generated_task_ids: []

  - id: phase-a-02
    phase: A
    title: Harness group expansion for implementation work
    brief: .harness/spec-batches/phase-a-02.md
    status: not_ready
    depends_on:
