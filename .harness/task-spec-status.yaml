      Add #[rseq::framework_type], #[rseq::abstraction], and named
      #[rseq::intrinsic] attributes to all facade types and intrinsic
      methods. Remove ErrorKind alias.
    spec_authoring_notes:
      - Attributes are inert tool attributes -- adding them does not change compilation.
      - Register access intrinsics go on Mmio<T> methods, NOT on ReadOnly/WriteOnly/ReadWrite.
      - Clock, ResetLine, PinCtrl carry their own #[rseq::intrinsic] methods.
    generated_task_ids:
