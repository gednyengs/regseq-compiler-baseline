      + old-model deletion -- absorbs execution-plan 9.1). No compat.rs
      adapter. emit_driver cuts over LAST, not first.
    spec_authoring_notes:
      - Read migration.md Q5-Q8 before implementing.
      - Phase 7.0 runs in parallel (3 tasks).
      - Phase 7C absorbs execution-plan Phase 8.1 (CFG-based C emission);
        Phase 7F absorbs execution-plan Phase 9.1 (old-module deletion).
      - DriverLoweringPlan trims vestigial fields (behavior,
        legacy_behavior, callback_actions); body access via
        FunctionBodyIndex<'_> (task 8), not a plan field.
      - LinuxBackendPlan must own a complete emission contract (no
        dual-plan emitter signatures).
      - c_ast.rs moves to crates/regseq-backends/src/c/ and gains
        statement / expression / declarator / initializer / labels+goto
        ASTs.
      - Emission contract (task 1) is the oracle -- subject to
        adversarial Codex review before tasks 9/10 start.
      - PL011 reference is blessed emitter output (not hand-authored),
        gated on QEMU functional smoke that exercises probe + tty open
        + byte write + close + module unload.
