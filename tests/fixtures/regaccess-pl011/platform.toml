version = "1"

[platform]
os = "linux"
board = "qemu-virt"
arch = "aarch64"

# Register-access MMIO region binding (L2). The section key `regs` joins to the
# L1 resource declared `#[rseq::mmio(id = "regs")]`. PL011 is a memory-mapped
# (DT/AMBA) device, so the binding is a static base + size. (Consumed at
# map_region by the lifecycle/bus-resource seam; for this host generic-c proof
# the device model is a global register file, so these values are illustrative.)
[mmio.regs]
base = 0x09000000
size = 0x1000
