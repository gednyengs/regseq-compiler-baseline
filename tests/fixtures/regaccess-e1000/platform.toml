version = "1"

[platform]
os = "linux"
board = "qemu-pc"
arch = "x86_64"

# Register-access MMIO region binding (L2). The section key `regs` joins to the
# L1 resource declared `#[rseq::mmio(id = "regs")]`. E1000 is a PCI device: its
# register space is MMIO BAR0, so the L2 binding is a BAR SELECTOR (base/size are
# resolved at probe by bus-resource), not a static base. (For this host generic-c
# proof the device model is a global register file, so this is illustrative.)
[mmio.regs]
bar = 0
