[project]
name = "regseq-harness"
version = "0.1.0"
description = "Python harness utilities for the regseq compiler workspace"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts/python"]
testpaths = ["scripts/python"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
