[package]
name = "regseq-driver-old"
version = "0.1.0"
edition = "2021"

[package.metadata.rust-analyzer]
rustc_private = true

[features]
post-monorust-tests = []

[dependencies]
regseq-analysis-old = { path = "../regseq-analysis-old" }
regseq-backends-old = { path = "../regseq-backends-old" }
regseq-config = { path = "../regseq-config" }
regseq-model-old = { path = "../regseq-model-old" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
