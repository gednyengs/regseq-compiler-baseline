[package]
name = "codegen-coverage-runner"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata.rust-analyzer]
rustc_private = true

[lib]
name = "codegen_coverage_runner"
path = "src/lib.rs"

[[bin]]
name = "codegen-coverage-runner"
path = "src/main.rs"

[dependencies]
test-ir-fixtures = { path = "../test-ir-fixtures" }
regseq-model = { path = "../regseq-model" }
regseq-backends = { path = "../regseq-backends" }
regseq-config = { path = "../regseq-config" }
# L2 (platform-file) binding — the light, rustc-free crate (regseq-model +
# regseq-config only). The runner runs its bind/validate over the bridged model
# before emit (T2), mirroring production's post-bridge "1b" seam, so the bound
# model is the artifact the backend goldens capture.
regseq-l2 = { path = "../regseq-l2" }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# regseq-driver-92: the `?`-normalizer coverage test names
# `regseq_driver::bridge::BridgeError::UnsupportedQuestionMark` to assert
# the fail-loud diagnostic. Same crate instance test-ir-fixtures links.
regseq-driver = { path = "../regseq-driver" }
