name   = "b8_item_kinds"
kind   = "rust"
entry  = "regseq_main"
# B8 (plan §3): item kinds — the constructs a plain fn fixture does NOT contain.
# This fixture greens the four item-kind rows that survive the bridge as observable
# runtime behavior: a Static item (read) + a `static mut` (read under unsafe) drive
# IT-2/IN-7; a named `const` used in a computation drives IT-3/IN-8. Each row is
# driven by a logged computation in input.rs (see its `proves:` map).
#
# IT-8 (link_section) and IT-9 (inline_hint) are now GREENED here — regseq-driver-83
# made the bridge read rustc's `codegen_fn_attrs` at the source-item site
# (regseq-driver/src/bridge/ty.rs), so `Item.link_section` / `Item.inline_hint`
# reach the backend's `fn_qualifiers` (regseq-backends/src/generic_c/mod.rs:799-817).
# A `#[link_section=".driver_data"]` function emits
# `__attribute__((section(".driver_data")))`; `#[inline(always)]` emits
# `inline __attribute__((always_inline))` and `#[inline(never)]` emits
# `__attribute__((noinline))` — all visible in golden.c and exercised through
# regseq_main.
#
# IN-3 (foreign fn body:None) is now GREENED here — regseq-driver-84 made the
# bridge mint the foreign fn's `emission_name` from its real ABI link name
# (rustc `tcx.item_name` / `#[link_name]`, regseq-driver/src/bridge/mod.rs) rather
# than its rendered DefPath. The backend's `naming::instance_symbol_base`
# (regseq-backends/src/generic_c/naming.rs:144-147) sanitizes that verbatim, so an
# `extern "C" { fn abs(i:i32)->i32; }` now emits `extern int32_t abs(int32_t);` +
# a call to `abs(...)`; libc exports `abs`, so the LINK resolves and `abs(-5)`
# runs to 5, logged through regseq_main.
#
# The remaining assigned row stays DEFERRED — the BRIDGE never-sets the construct,
# so it NEVER reaches the backend emitter. This is a bridge gap, not a
# fixture-recipe gap (Codex-confirmed 2026-05-29):
#
# DEFERRED — IT-14 (opaque_handle): a bridge-classified Item flag
#   (`Item.opaque_handle_eligible`) HARDCODED to `false` at every ADT-item
#   construction site (regseq-driver/src/bridge/ty.rs; every other
#   `opaque_handle_eligible:` in src/bridge/* is also `false`); NO code path sets it
#   `true`. Structurally unreachable from any `kind=rust` fixture.
covers = [
  "IT-2", "IT-3", "IT-8", "IT-9",
  "IN-3", "IN-7", "IN-8",
]
expect = "pass"
