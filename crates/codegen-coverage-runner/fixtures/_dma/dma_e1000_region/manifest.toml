name   = "dma_e1000_region"
kind   = "rust"
# The dma-management M1 E1000 coherent-region golden (PLAN T23). An E1000-style
# TX driver: a coherent `DmaRegion<LegacyTxDesc>` ring written through the REAL
# closure-borrow element-access surface (T13), the ring base programmed from
# `device_addr()` (A2), and the TX-tail doorbell rung. The golden asserts BOTH
# oracles: (bytes) the descriptor bytes in the region's backing buffer == the
# expected LegacyTxDesc layout; (codegen-shape) the emitted sequence
#   …region stores… → regseq_dma_wmb() → regseq_mmio_w32(<doorbell TDT>)
# in order — FAILS if the store→doorbell fence (T16/C07/D09) is absent/misordered.
# The compiler-managed alloc_coherent/free_coherent lifecycle frames the device
# lifetime (T12). generic-c only, Tier-1, candidate-prototype.
#
# Run by the dedicated sole-binary `dma_e1000_region_e2e` ONLY (clean-process
# interner isolation, like e1000_composed_e2e / clock-pl011-static): the emit's
# MIR byte-snapshot is reproducible only in a dedicated process.
# The E1000 coherent half exercises: region alloc/free lifecycle (DMA-1), A2
# addressing (DMA-2), element_access (DMA-3), the store_order fence (DMA-4), and
# the generic-c host DMA model (DMA-12). Numeric DMA-N row ids match the Doc-1
# matrix (`is_row_id`: `[A-Z]{2,3}-\d+`); `dma_covers.rs` is the coverage gate.
covers = ["DMA-1", "DMA-2", "DMA-3", "DMA-4", "DMA-12"]
lifecycle_scenario = "orderly"
expect = "pass"
