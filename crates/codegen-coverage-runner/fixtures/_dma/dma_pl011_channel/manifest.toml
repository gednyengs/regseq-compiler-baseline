name   = "dma_pl011_channel"
kind   = "rust"
# The dma-management M3 PL011 slave-channel golden (PLAN T26). A PL011-style amba
# driver: a slave `DmaChannel` (RX, device_to_host) + a coherent `DmaRegion<u8>`
# RX buffer. `on_init` runs configure() → stage_transfer(rx_buf.span(0..32)) →
# start_transfer() (consuming each Result with `?`); a
# `#[rseq::dma_completion(channel = "rx")]` handler binds the framework completion
# callback (registration-shape only — never fired, D06).
#
# The golden COMPILES + RUNS (the first behavioral channel validation). The trace
# asserts the full M3 channel path in order:
#   alloc_coherent (region) → request_channel → register_completion →
#   configure → stage_transfer (REAL span addr/len) → start_transfer →
#   (teardown) release_channel → free_coherent (LIFO).
# The span lowers to the real device address (dev_base("rx_buf") + 0*1) and len
# 32*1 = 32 (M3/T26 — replaces the M2 0/0 placeholder). generic-c only, Tier-1.
#
# Run by the dedicated sole-binary `dma_pl011_e2e` ONLY (clean-process interner
# isolation, like dma_e1000_region_e2e): the emit's MIR byte-snapshot is
# reproducible only in a dedicated process.
# The PL011 channel half exercises: channel transport + lifecycle (DMA-5), the
# span endpoint (DMA-6), completion registration shape (DMA-7), the region
# alloc/free lifecycle of its `DmaRegion<u8>` RX buffer (DMA-1), and the host DMA
# model (DMA-12). Numeric DMA-N row ids match the Doc-1 matrix; `dma_covers.rs`
# is the coverage gate.
covers = ["DMA-1", "DMA-5", "DMA-6", "DMA-7", "DMA-12"]
lifecycle_scenario = "orderly"
expect = "pass"
