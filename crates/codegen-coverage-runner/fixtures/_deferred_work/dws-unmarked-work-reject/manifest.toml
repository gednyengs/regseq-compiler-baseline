name   = "dws-unmarked-work-reject"
kind   = "rust"
# T14 ADT-DefId recognition probe — unmarked-Work half (PLAN T14): a local struct
# NAMED `Work` but WITHOUT the #[rseq::abstraction("deferred_work")] marker is NOT
# recognized as a deferred-work resource (recognition is marker/DefId-based, not
# name-based, GRILL D04). Because it is NOT claimed by deferred-work recognition,
# the field falls through to device-lifecycle USER-DATA classification — where a
# non-scalar struct is rejected. That rejection IS the proof: a name-based
# recognizer would have claimed `work: Work` and never routed it to user-data.
# (Stronger/more direct than reaching BARE-WH-ZERO-WORK, which the PLAN expected
# before the empirical finding that user-data validation fires first.) Auto-run by
# `dws_reject_e2e`.
covers = ["DWS-6"]
expect = "reject"

[expected]
stage = "acquire"
diagnostic = "field `work` of type `Work` is not a valid user-data field"
