version = "1"

[platform]
os = "linux"
board = "qemu-virt"
arch = "aarch64"

# L2 MMIO region binding (QEMU virt PL011: base 0x0900_0000, size 0x1000).
[mmio.regs]
base = 0x09000000
size = 0x1000

# L2 pinctrl binding (C01): the section is PRESENT, so the optional
# `Option<PinCtrl>` resolves to `Some` (D06). A present section MUST contain
# "default" (D07); the author selects "default"/"sleep".
[pinctrl.uart_pins]
pin_states = ["default", "sleep"]
