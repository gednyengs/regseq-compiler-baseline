version = "1"

[platform]
os = "linux"
board = "qemu-virt"
arch = "aarch64"

# L2 MMIO region binding (QEMU virt PL011: base 0x0900_0000, size 0x1000).
[mmio.regs]
base = 0x09000000
size = 0x1000

# There is deliberately NO pinctrl section here: the optional `Option<PinCtrl>`
# resource binds to `None` (resolved = false, D06). This absence is ALLOWED for the
# optional form (it is PIN-L2-NO-INVENTORY only for the required form, D03/C06).
