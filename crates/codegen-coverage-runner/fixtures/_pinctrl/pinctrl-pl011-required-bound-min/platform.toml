version = "1"

[platform]
os = "linux"
board = "qemu-virt"
arch = "aarch64"

# L2 MMIO region binding (QEMU virt PL011: base 0x0900_0000, size 0x1000),
# joining the L1 `#[rseq::mmio(id = "regs")]`.
[mmio.regs]
base = 0x09000000
size = 0x1000

# L2 pinctrl binding (C01), joining the L1 `#[rseq::pinctrl(id = "uart_pins")]`.
# A present section MUST contain "default" (D07); the author may select any
# listed state. The contents of each state (mux/pad maps) are board-owned —
# pinctrl is state-SELECTION only (D08).
[pinctrl.uart_pins]
pin_states = ["default", "sleep"]
