version = "1"

[platform]
os = "linux"
board = "qemu-virt"
arch = "aarch64"

# L2 MMIO region binding (QEMU virt PL011: base 0x0900_0000, size 0x1000).
[mmio.regs]
base = 0x09000000
size = 0x1000

# L2 clock binding (C01) — a MANAGED clock (mode + provider + default_frequency),
# so the composed fixture witnesses the real devm_clk_get / clock_control_on path
# interleaved with the region map and the interrupt register.
[clock.uartclk]
mode = "managed"
default_frequency = 24000000
provider = "uartclk"

# L2 interrupt binding (C03), joining `#[rseq::interrupt(id = "uart_irq")]`.
# QEMU virt PL011: SPI 33 → INTID 37. Canonical spellings only (D10/R12).
[interrupt.uart_irq]
irq_number = 37
trigger_type = "level"
trigger_polarity = "active_high"
shared = false
