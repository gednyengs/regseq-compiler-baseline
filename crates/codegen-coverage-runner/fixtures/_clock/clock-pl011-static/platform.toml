version = "1"

[platform]
os = "linux"
board = "qemu-virt"
arch = "aarch64"

# L2 MMIO region binding (QEMU virt PL011: base 0x0900_0000, size 0x1000),
# joining the L1 `#[rseq::mmio(id = "regs")]`.
[mmio.regs]
base = 0x09000000
size = 0x1000

# L2 clock binding (C01), joining the L1 `#[rseq::clock(id = "uartclk")]`. A
# STATIC clock: a fixed `default_frequency` and NO `provider` (forbidden iff
# static, D14/I03). `get_rate` const-folds to this value; `enable`/`disable`
# are no-ops. The frequency differs from the managed fixture's (48 vs 24 MHz)
# so the folded `W…` value visibly distinguishes the two oracle goldens.
[clock.uartclk]
mode = "static"
default_frequency = 48000000
