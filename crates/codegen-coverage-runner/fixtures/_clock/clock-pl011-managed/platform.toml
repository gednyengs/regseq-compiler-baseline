version = "1"

[platform]
os = "linux"
board = "qemu-virt"
arch = "aarch64"

# L2 MMIO region binding (QEMU virt PL011: base 0x0900_0000, size 0x1000),
# joining the L1 `#[rseq::mmio(id = "regs")]`.
[mmio.regs]
base = 0x09000000
size = 0x1000

# L2 clock binding (C01), joining the L1 `#[rseq::clock(id = "uartclk")]`. A
# MANAGED clock: it carries a `provider` (the backend-interpreted con-id /
# DT clock spec, D14) and a `default_frequency` (schema/static-portability, NOT
# a managed runtime fallback — D10/I04).
[clock.uartclk]
mode = "managed"
default_frequency = 24000000
provider = "uartclk"
