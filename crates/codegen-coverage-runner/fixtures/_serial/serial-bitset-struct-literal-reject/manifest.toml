# 1<<7 }` (include! puts the driver in the surface module, so the private field is
# reachable) bypasses the from_bits anchor. The aggregate's bits field is sliced
# and rejected.
covers = ["SER-O2-BODY-PROVENANCE"]
expect = "reject"

[expected]
stage = "acquire"
diagnostic = "SER-ERR-BITSET-PROVENANCE"
