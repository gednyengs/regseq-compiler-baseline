name   = "serial-rxerror-const-mismatch-reject"
kind   = "rust"
# O2 hardening: an author `RX_ERR_*` bit-position const disagrees with the pinned
# RxErrorRepr convention (bit position = SerialRxErrorKind discriminant). The
# backend would misclassify the inline RX error — rejected at the frontend.
covers = ["SER-O2-HARDENING"]
expect = "reject"

[expected]
stage = "acquire"
diagnostic = "SER-ERR-REPR-CONST"
