version = "1"

[platform]
os = "linux"
board = "qemu-virt"
arch = "aarch64"

# L2 MMIO region binding (QEMU virt PL011: base 0x0900_0000, size 0x1000),
# joining the L1 `#[rseq::mmio(id = "regs")]`.
[mmio.regs]
base = 0x09000000
size = 0x1000

# L2 interrupt binding, joining the L1 `#[rseq::interrupt(id = "uart_irq")]`.
# QEMU virt PL011: SPI 33 → INTID 37. Canonical spellings only.
[interrupt.uart_irq]
irq_number = 37
trigger_type = "level"
trigger_polarity = "active_high"
shared = false
