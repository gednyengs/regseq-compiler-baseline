version = "1"

[platform]
os = "zephyr"
board = "qemu_cortex_a53"
arch = "aarch64"

# L2 MMIO region binding: the section key `regs` joins the L1 resource declared
# `#[rseq::mmio(id = "regs")]`. The eval Zephyr campaign's DUT is the SECOND
# PL011 of the patched QEMU machine: base 0x0904_0000, size 0x1000 (mirrors
# pl011-composed; the console PL011 at 0x0900_0000 stays the stock arm,pl011).
# Per the ratified A-10 policy these L2 literals are REQUIRED as the resolution
# trigger; the zephyr_c backend consumes DT `reg` normatively and emits the A-1
# BUILD_ASSERT cross-checking DT against these literals (D11).
[mmio.regs]
base = 0x09040000
size = 0x1000

# L2 interrupt binding, joining the L1 `#[rseq::interrupt(id = "uart_irq")]`.
# ADVISORY on Zephyr (R10): DT_INST_IRQN(0) / DT_INST_IRQ(0, priority) are
# authoritative — the live DUT overlay supplies the real cell; this value only
# renders as the advisory comment. Canonical spellings only.
[interrupt.uart_irq]
irq_number = 37
trigger_type = "level"
trigger_polarity = "active_high"
shared = false
