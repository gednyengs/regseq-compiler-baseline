name   = "serial-cause-const-mismatch-reject"
kind   = "rust"
# O2 hardening: an author `CAUSE_*` bit-position const disagrees with the pinned
# CauseSetRepr convention (bit position = SerialCause discriminant). The backend
# would misclassify the decoded causes — rejected at the frontend.
covers = ["SER-O2-HARDENING"]
expect = "reject"

[expected]
stage = "acquire"
diagnostic = "SER-ERR-REPR-CONST"
