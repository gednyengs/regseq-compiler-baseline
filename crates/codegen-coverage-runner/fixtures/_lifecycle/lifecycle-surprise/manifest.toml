name   = "lifecycle-surprise"
kind   = "rust"
# Device-lifecycle surprise removal (M4): a fieldless DT-matched `#[rseq::driver]`
# overriding `on_surprise_remove`, with NO `regseq_main`. The backend synthesizes
# `main` (RD-4/RD-6); the `surprise` scenario lowers to register -> create ->
# associate -> `LC call on_init` -> `LC teardown present=0` -> `LC call
# on_surprise_remove` (always, CR-3) + a call to FakeSurprise::on_surprise_remove.
# Byte-distinct from orderly (present=0 vs 1, surprise_remove vs deinit). Fieldless,
# so no `skipped(surprise)` postambles (the with-resources DISPATCH-SURPRISE row
# LC-11 lands with lifecycle-handle, M7). covers the registration (LC-1), the
# devicetree match (LC-2), and the teardown dispatch present=0 branch (LC-7).
lifecycle_scenario = "surprise"
covers = ["LC-1", "LC-2", "LC-7"]
expect = "pass"
