name   = "lifecycle-fake"
kind   = "rust"
# Device-lifecycle walking skeleton (M0) + orderly teardown (M2): a fieldless
# DT-matched `#[rseq::driver]` with an `impl Lifecycle` overriding `on_init` only
# and NO `regseq_main`. The backend synthesizes `main` (RD-4/RD-6); the `orderly`
# scenario lowers to register -> create -> associate -> `LC call on_init` + a call
# to `Fake::on_init` -> `LC teardown present=1` -> `LC call on_deinit` (the
# trait-default no-op, marker always emitted, CR-3). Fieldless, so no resource
# preamble/postamble. covers the registration (LC-1), the devicetree match
# (LC-2), the create->on_init ordering (LC-5), and the teardown dispatch (LC-7).
lifecycle_scenario = "orderly"
covers = ["LC-1", "LC-2", "LC-5", "LC-7"]
expect = "pass"
