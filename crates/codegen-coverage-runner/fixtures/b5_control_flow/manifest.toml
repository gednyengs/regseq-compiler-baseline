name   = "b5_control_flow"
kind   = "rust"
entry  = "regseq_main"
# B5 (plan §3): control flow + calls. Goto back-edge (TM-1), match->SwitchTargets
# (TM-7), an indirect call through a fn-pointer value loaded from a static (TM-9),
# the FnPtr type (TY-13), the UnsafeFnPointer pointer-coercion (PC-2 / CK-3), and Drop
# glue run at scope exit (TM-10). Each row is driven by a logged computation in
# input.rs (see its per-line `proves:` map).
#
# IN-5 (FunctionInstanceFlavor): the TM-10 drop glue synthesizes a DropGlue-flavor
# instance (emitted as input__regseq_synth__drop_glue_*), which IS a non-Item shim
# flavor — so IN-5 is genuinely exercised here (the row is any reachable shim flavor,
# not specifically ReifyShim; confirmed by Codex review of the bug specs).
#
# PC-1 (ReifyFnPointer) — a fn-item -> fn-pointer reify bridges as
# `Cast(PointerCoercion(ReifyFnPointer), Const::ZST, FnPtr)`. The bridge
# (regseq-backends-20) now recovers the FnDef identity at the cast site and
# lowers the operand to a `Const::Reloc`, so PC-1 is covered by the dedicated
# `b5_reify_fnptr` fixture. This fixture keeps the static-fn-ptr route for
# TM-9/TY-13/PC-2/CK-3.
#
# DEFERRED — one row hits a genuine backend bug (not a recipe gap), filed as a task:
#  * IT-13 (ManuallyDrop) — regseq-backends-22. `core::mem::ManuallyDrop<T>` is a TUPLE
#    struct; the backend emits its field with the raw rustc index name (invalid C), so
#    any use fails to compile. (This fixture uses a NAMED-field `struct D { v: u32 }`
#    for its Drop type to keep TM-10 green.) Proving IT-13 also needs is_manually_drop
#    drop-suppression handling (per the Codex spec review).
covers = [
  "TM-1", "TM-7", "TM-9", "TM-10",
  "TY-13", "IN-5",
  "PC-2", "CK-3",
]
expect = "pass"
